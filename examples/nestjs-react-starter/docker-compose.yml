services:
  postgres:
    image: postgres:16
    container_name: authdock-pg
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: authdock
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d authdock']
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - authdock_pg_data:/var/lib/postgresql/data

volumes:
  authdock_pg_data:
